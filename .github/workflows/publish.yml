name: Publish font packages

on:
  workflow_dispatch:
    inputs:
      packageNames:
        description: 'Enter a comma-separated list of package names to publish'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: ''
          sparse-checkout-cone-mode: false

      - name: Fetch packages to publish
        run: |
          git sparse-checkout set $(echo "${{ github.event.inputs.packageNames }}" | tr ',' '\n' | sed -e 's/^[[:space:]]*//' | sed 's|^|font-packages/|')
          git pull origin ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish specific packages
        run: |
          count=0
          IFS=',' read -ra PACKAGES <<< "${{ github.event.inputs.packageNames }}"
          ls -la font-packages
          for package in "${PACKAGES[@]}"; do
            # Remove any whitespace
            package=$(echo "$package" | tr -d '[:space:]')
            
            if [ ! -d "font-packages/$package" ]; then
              echo "Error: Package directory 'font-packages/$package' does not exist"
              exit 1
            fi

            if [ $((count % 2)) -eq 0 ]; then
              export NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN }}
            else
              export NODE_AUTH_TOKEN=${{ secrets.NPM_TOKEN_2 }}
            fi

            echo "Publishing package: $package"
            (cd "font-packages/$package" && ls -la)
            count=$((count + 1))
          done
