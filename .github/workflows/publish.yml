name: Publish font packages

on:
  workflow_dispatch:
    inputs:
      publishAll:
        description: 'Publish all packages'
        type: boolean
      packageNames:
        description: 'OR enter a comma-separated list of package names to publish'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clone required package directories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_NAMES: ${{ github.event.inputs.packageNames }}
          PUBLISH_ALL: ${{ github.event.inputs.publishAll }}
        run: |
          set -euo pipefail

          sparse_paths=()

          if [ "$PUBLISH_ALL" = "true" ]; then
            sparse_paths=("font-packages")
          else
            if [ -z "${PACKAGE_NAMES//[[:space:],]/}" ]; then
              echo "Error: packageNames is required when publishAll is false"
              exit 1
            fi

            IFS=',' read -ra packages <<< "$PACKAGE_NAMES"
            for package in "${packages[@]}"; do
              package="${package//[[:space:]]/}"

              if [ -z "$package" ]; then
                continue
              fi

              if [[ "$package" == *"/"* || "$package" == *".."* ]]; then
                echo "Error: Package names must be font package directory names, got '$package'"
                exit 1
              fi

              sparse_paths+=("font-packages/$package")
            done

            if [ ${#sparse_paths[@]} -eq 0 ]; then
              echo "Error: packageNames must include at least one package"
              exit 1
            fi
          fi

          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"

          git -c http.https://github.com/.extraheader="$auth_header" clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --no-checkout \
            --branch "$GITHUB_REF_NAME" \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            .

          git sparse-checkout set -- "${sparse_paths[@]}"
          git -c http.https://github.com/.extraheader="$auth_header" checkout --detach "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish all packages
        if: ${{ github.event.inputs.publishAll == 'true' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN_2: ${{ secrets.NPM_TOKEN_2 }}
        run: |
          set -euo pipefail

          count=0
          for package in font-packages/*; do
            if [ -d "$package" ]; then
              echo "Publishing package: $(basename "$package")"
              if [ $((count % 2)) -eq 0 ]; then
                export NODE_AUTH_TOKEN="$NPM_TOKEN"
              else
                export NODE_AUTH_TOKEN="$NPM_TOKEN_2"
              fi
              (cd "$package" && npm publish --access public)
              count=$((count + 1))
            fi
          done

      - name: Publish specific packages
        if: ${{ github.event.inputs.publishAll != 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_NAMES: ${{ github.event.inputs.packageNames }}
        run: |
          set -euo pipefail

          published_count=0
          IFS=',' read -ra PACKAGES <<< "$PACKAGE_NAMES"
          for package in "${PACKAGES[@]}"; do
            # Remove any whitespace
            package="${package//[[:space:]]/}"

            if [ -z "$package" ]; then
              continue
            fi

            if [[ "$package" == *"/"* || "$package" == *".."* ]]; then
              echo "Error: Package names must be font package directory names, got '$package'"
              exit 1
            fi

            if [ ! -d "font-packages/$package" ]; then
              echo "Error: Package directory 'font-packages/$package' does not exist"
              exit 1
            fi

            echo "Publishing package: $package"
            (cd "font-packages/$package" && npm publish --access public)
            published_count=$((published_count + 1))
          done

          if [ $published_count -eq 0 ]; then
            echo "Error: packageNames must include at least one package"
            exit 1
          fi

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: publish
    if: failure()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 Workflow 'Publish font packages' failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*🚨 Failed to Publish font packages*"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>"
